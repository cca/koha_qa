[project]
name = "koha_qa"
version = "0.1.0"
description = "MARC record utilities for Koha & Summon"
authors = [{name = "Eric Phetteplace", email = "ephetteplace@cca.edu"}]
readme = "readme.md"
license = {file = "LICENSE.txt"}
keywords = ["koha", "marc", "summon"]
classifiers = [
     "Development Status :: 5 - Production/Stable",
      "Programming Language :: Python :: 3.11"
]
requires-python = ">=3.11"
dependencies = [
    "click==8.4.1",
    "httpx==0.28.1",
    "paramiko==3.5.1",
    "pydantic-marc==0.1.0",
    "pymarc>=5.3",
    "pysftp==0.2.9",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
]

[project.urls]
Homepage = "https://github.com/cca/koha_qa"
Issues = "https://github.com/cca/koha_qa/issues"
Repository = "https://github.com/cca/koha_qa"

[dependency-groups]
dev = [
    "ruff>=0.15.16",
]

[tool.ruff.lint]
# Bugbear, Pyflakes, import sorting, syntax upgrades, security, simplicity
select = ["B", "F", "I", "UP", "S", "SIM"]
ignore = [
    # Line too long
    "E501",
    # Allow assert
    "S101",
]
